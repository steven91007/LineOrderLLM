<!DOCTYPE html>
<html>
<head>
    <title>LIFF 調試頁面</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h2>LIFF 調試資訊</h2>
    <div id="debug-info"></div>
    
    <script>
        function showDebugInfo(info) {
            document.getElementById('debug-info').innerHTML += '<p>' + info + '</p>';
            console.log(info);
        }
        
        showDebugInfo('頁面載入完成');
        showDebugInfo('當前 URL: ' + window.location.href);
        
        const urlParams = new URLSearchParams(window.location.search);
        showDebugInfo('URL 參數: ' + urlParams.toString());
        showDebugInfo('Session ID: ' + urlParams.get('session'));
        
        // LIFF 初始化
        liff.init({
            liffId: '2007889032-OolKDrp3'
        }).then(() => {
            showDebugInfo('LIFF 初始化成功');
            showDebugInfo('是否在 LINE 中: ' + liff.isInClient());
            showDebugInfo('是否已登入: ' + liff.isLoggedIn());
            
            if (liff.isLoggedIn()) {
                return liff.getProfile();
            }
        }).then(profile => {
            if (profile) {
                showDebugInfo('用戶 ID: ' + profile.userId);
                showDebugInfo('用戶名稱: ' + profile.displayName);
            }
        }).catch(err => {
            showDebugInfo('LIFF 錯誤: ' + err.message);
        });
    </script>
</body>
</html>
