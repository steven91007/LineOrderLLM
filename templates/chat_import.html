<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天紀錄匯入訂單</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #dfe3e8; --text: #1f2933;
    --muted: #6b7684; --ready: #1a7f5a; --review: #b26a00; --dup: #7a8290;
    --ready-bg: #e8f5ef; --review-bg: #fdf3e2; --dup-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; line-height: 1.6;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  textarea {
    width: 100%; min-height: 260px; padding: 12px; border: 1px solid var(--line);
    border-radius: 8px; font-family: Consolas, "Microsoft JhengHei", monospace;
    font-size: 13px; resize: vertical;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  select, button {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
    font-size: 14px; font-family: inherit; background: #fff;
  }
  button { cursor: pointer; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 600; }
  button.primary:disabled { background: #9fb8dd; border-color: #9fb8dd; cursor: not-allowed; }
  button.danger { background: #b3261e; color: #fff; border-color: #b3261e; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; }

  .order {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px; background: #fff;
  }
  .order.ready { border-left: 4px solid var(--ready); }
  .order.review { border-left: 4px solid var(--review); }
  .order.duplicate { border-left: 4px solid var(--dup); opacity: .75; }
  .ohead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
  .badge.ready { background: var(--ready-bg); color: var(--ready); }
  .badge.review { background: var(--review-bg); color: var(--review); }
  .badge.duplicate { background: var(--dup-bg); color: var(--dup); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 20px; font-size: 14px; }
  .f b { color: var(--muted); font-weight: 500; display: inline-block; min-width: 76px; }
  .quote { margin-top: 10px; font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
  .prob { margin-top: 8px; font-size: 13px; color: var(--review); }
  .prob div::before { content: "⚠ "; }
  .empty { color: #b9bec6; }

  .summary { display: flex; gap: 18px; font-size: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .msg.ok { background: var(--ready-bg); color: var(--ready); }
  .msg.err { background: #fdeceb; color: #b3261e; }
  .spinner { display: none; color: var(--muted); font-size: 14px; }
  .spinner.on { display: inline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>聊天紀錄匯入訂單</h1>
  <div class="sub">貼上 LINE 聊天紀錄 → 預覽解析結果 → 勾選後寫入 Google 試算表</div>

  <div class="card">
    <textarea id="log" placeholder="把 LINE 聊天紀錄貼在這裡&#10;&#10;例如：&#10;2026/08/12 09:14&#9;林佩宜&#9;老闆早～我要訂兩份&#10;2026/08/12 09:17&#9;林佩宜&#9;收件人 張美玲 0911222333 台北市信義區松高路11號8樓&#10;2026/08/12 09:19&#9;林佩宜&#9;要20A兩盒 這禮拜日出貨"></textarea>
    <div class="row">
      <select id="model">
        <option value="gpt-5.6-luna">gpt-5.6-luna（預設）</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4o-mini">gpt-4o-mini（便宜但會漏單，不建議）</option>
      </select>
      <label class="hint"><input type="checkbox" id="normalize" checked> 套用地址標準化</label>
      <button class="primary" id="parseBtn" onclick="parseLog()">解析</button>
      <span class="spinner" id="spin">解析中，請稍候…</span>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
let parsed = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]
  ));
}
function val(s) { return s ? esc(s) : '<span class="empty">—</span>'; }

async function parseLog() {
  const log = document.getElementById('log').value.trim();
  if (!log) { alert('請先貼上聊天紀錄'); return; }

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  document.getElementById('spin').classList.add('on');
  document.getElementById('result').innerHTML = '';

  try {
    const res = await fetch('/api/parse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        chat_log: log,
        model: document.getElementById('model').value,
        normalize: document.getElementById('normalize').checked,
      }),
    });
    const data = await res.json();
    if (!data.success) { showError(data.error); return; }
    parsed = data.orders;
    render();
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    document.getElementById('spin').classList.remove('on');
  }
}

function showError(msg) {
  document.getElementById('result').innerHTML =
    '<div class="msg err">解析失敗：' + esc(msg) + '</div>';
}

const LABEL = {ready: '可寫入', review: '需確認', duplicate: '已存在'};

function render(banner) {
  if (!parsed.length) {
    document.getElementById('result').innerHTML =
      '<div class="card">這段對話裡沒有解析出任何訂單。</div>';
    return;
  }
  const count = {ready: 0, review: 0, duplicate: 0};
  parsed.forEach(p => count[p.status]++);

  let html = (banner || '') +
    '<div class="card"><div class="summary">' +
      '<span>合計 <b>' + parsed.length + '</b> 筆</span>' +
      '<span style="color:var(--ready)">可寫入 ' + count.ready + '</span>' +
      '<span style="color:var(--review)">需確認 ' + count.review + '</span>' +
      '<span style="color:var(--dup)">已存在 ' + count.duplicate + '</span>' +
    '</div>' +
    '<div class="row">' +
      '<button onclick="selectAll(true)">全選可寫入</button>' +
      '<button onclick="selectAll(false)">全部取消</button>' +
      '<button class="danger" onclick="writeSelected()">寫入勾選的訂單</button>' +
      '<span class="hint">「已存在」表示試算表裡已有相同收件人／電話／配送日的訂單</span>' +
    '</div></div>';

  parsed.forEach((p, i) => {
    const o = p.order;
    const items = [o.giftbox, o.family].filter(Boolean).join(' ／ ');
    html +=
      '<div class="order ' + p.status + '">' +
        '<div class="ohead">' +
          '<input type="checkbox" data-i="' + i + '"' +
            (p.status === 'ready' ? ' checked' : '') + '>' +
          '<span class="badge ' + p.status + '">' + LABEL[p.status] + '</span>' +
          '<b>' + val(o.receiver_name) + '</b>' +
        '</div>' +
        '<div class="fields">' +
          '<div class="f"><b>訂購人</b>' + val(o.orderer) + '</div>' +
          '<div class="f"><b>寄件人</b>' + val(o.sender_name) + ' ' + esc(o.sender_phone || '') + '</div>' +
          '<div class="f"><b>收件人</b>' + val(o.receiver_name) + ' ' + esc(o.receiver_phone || '') + '</div>' +
          '<div class="f"><b>配送日</b>' + val(o.shipping_date) + '</div>' +
          '<div class="f" style="grid-column:1/-1"><b>收件地址</b>' + val(o.receiver_address) + '</div>' +
          '<div class="f"><b>品項</b>' + val(items) + '</div>' +
          '<div class="f"><b>末五碼</b>' + val(o.last5) + '</div>' +
        '</div>' +
        (o.source_quote ? '<div class="quote">依據：' + esc(o.source_quote) + '</div>' : '') +
        (p.problems.length
          ? '<div class="prob">' + p.problems.map(x => '<div>' + esc(x) + '</div>').join('') + '</div>'
          : '') +
      '</div>';
  });

  document.getElementById('result').innerHTML = html;
}

function selectAll(onlyReady) {
  document.querySelectorAll('#result input[type=checkbox]').forEach(cb => {
    cb.checked = onlyReady ? parsed[cb.dataset.i].status === 'ready' : false;
  });
}

async function writeSelected() {
  const picked = [...document.querySelectorAll('#result input[type=checkbox]:checked')]
    .map(cb => Number(cb.dataset.i));
  if (!picked.length) { alert('沒有勾選任何訂單'); return; }

  const risky = picked.filter(i => parsed[i].status !== 'ready').length;
  const warn = risky
    ? '\n\n其中 ' + risky + ' 筆是「需確認」或「已存在」，確定仍要寫入？'
    : '';
  if (!confirm('即將寫入 ' + picked.length + ' 筆訂單到 Google 試算表。' + warn)) return;

  const res = await fetch('/api/write', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({indices: picked}),
  });
  const data = await res.json();

  if (!data.success) {
    render('<div class="msg err">寫入失敗：' + esc(data.error) + '</div>');
    return;
  }
  // 寫入成功的訂單改標為已存在，避免不小心重複送出
  picked.forEach(i => { parsed[i].status = 'duplicate'; });
  render('<div class="msg ok">已寫入 ' + data.appended_rows + ' 筆訂單到試算表。</div>');
}
</script>
</body>
</html>
