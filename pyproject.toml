[project]
name = "lineorderllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "dspy>=2.6.27",
    "flask>=3.1.1",
    "google-api-python-client>=2.177.0",
    # LLM 追蹤（取代原本的 MLflow）
    "langfuse>=4.14.4",
    "openinference-instrumentation-dspy>=0.1.39",
    "line-bot-sdk>=3.17.1",
    "openai>=1.97.1",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "requests>=2.32.0",
    "jsonschema>=4.25.0",
    "discord-py>=2.4",
]

[tool.pytest.ini_options]
# 測試從 repo 根目錄 import src.* 和 config，需要把根目錄放進 sys.path
pythonpath = ["."]
testpaths = ["tests"]
