[project]
name = "lineorderllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "dspy>=2.6.27",
    "flask>=3.1.1",
    "google-api-python-client>=2.177.0",
    # LLM tracing (replaces the former MLflow)
    "langfuse>=4.15.6",
    "openinference-instrumentation-dspy>=0.1.45",
    "line-bot-sdk>=3.17.1",
    "openai>=1.97.1",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "requests>=2.32.0",
    "jsonschema>=4.25.0",
    "discord-py>=2.4",
    "typesafe-sdk>=0.7.2",
]

[tool.pytest.ini_options]
# Tests import src.* and config from the repo root, so the root must be on sys.path
pythonpath = ["."]
testpaths = ["tests"]
