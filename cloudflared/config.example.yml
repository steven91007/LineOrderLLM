# Cloudflare Tunnel config template
#
# Usage:
#   1. Copy to config.yml
#   2. Replace <TUNNEL_ID>, <CREDENTIALS_DIR>, and <YOUR_DOMAIN> with real values
#   3. Put it in cloudflared's config directory:
#        Windows: %USERPROFILE%\.cloudflared\config.yml
#        Linux  : ~/.cloudflared/config.yml or /etc/cloudflared/config.yml
#
# See docs/cloudflare-tunnel.md for detailed steps

tunnel: <TUNNEL_ID>
credentials-file: <CREDENTIALS_DIR>/<TUNNEL_ID>.json

# Connection stability settings
# LINE webhooks are sensitive to response time; these reduce timeouts caused by disconnects and reconnects
protocol: quic
retries: 5
grace-period: 30s

ingress:
  # The LINE webhook and the LIFF pages both go to the same Flask app
  # app_with_liff.py listens on 5001; if you run main.py instead, change this to 5000
  - hostname: line.<YOUR_DOMAIN>
    service: http://localhost:5001
    originRequest:
      # The Flask dev server has no keep-alive tuning; shorten idle connections to avoid half-open connections
      connectTimeout: 10s
      noTLSVerify: true

  # Unmatched requests always get 404 (the last ingress rule must be a catch-all)
  - service: http_status:404
