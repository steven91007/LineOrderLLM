:root[data-theme="dark"] {

  --bg: #131417; --card: #1c1e22; --ink: #f2f3f5; --mut: #9aa1ab;
  --line: #33363c; --s1: #3987e5; --s2: #d95926; --good: #2fa57e;
  --bad: #e66767; --accentbg: #1d2836; --chip: #24262b;
  --na: #6b7280; --warn: #d8a75a; --warnbg: #2b2418;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.65 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 20; background: var(--card);

  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
nav { display: flex; gap: 4px; }
nav button { border: 1px solid var(--line); background: var(--card);
  color: var(--ink); border-radius: 999px; padding: 5px 14px;
  cursor: pointer; font-size: 13px; }
nav button.on { background: var(--s1); border-color: var(--s1); color: #fff; }

.chead:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.mask-toggle { margin-left: auto; font-size: 12.5px; color: var(--mut);

main { max-width: 1120px; margin: 0 auto; padding: 18px; }
section.page { display: none; }
section.page.on { display: block; }
.card { background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0 0 8px; }
.mut { color: var(--mut); }
.small { font-size: 12.5px; }
.lead { font-size: 15px; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;

  border-radius: 4px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit,

.tile { background: var(--card); border: 1px solid var(--line);

.tile .v { font-size: 22px; font-weight: 700; color: var(--s1);

.lsw { width: 22px; border-top: 1.5px solid var(--ink); }

.chead { display: flex; align-items: center; gap: 10px; padding: 9px 12px;

.ctitle { font-size: 13.5px; font-weight: 600; }

pre.code { margin: 0; background: var(--bg); border: 1px solid var(--line);

.tok-k { color: var(--s1); }

.io-tag { font-size: 10.5px; letter-spacing: .05em; border-radius: 4px;

.io-in { background: var(--chip); color: var(--mut); }
.io-out { background: var(--accentbg); color: var(--s1); }

.b-review { color: var(--warn); border-color: var(--warn); }
.b-duplicate { color: var(--mut); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

@media (prefers-reduced-motion: reduce) {

tLogOrderSignature(dspy.Signature):\n    \"\"\"Extract every order that was actually placed.\n\n    3. If the customer later amends (quantity, address, date), the LAST\n       statement wins. Do not output orders they explicitly cancelled.\n    4. Only \"just asking / still thinking / said no\" is not an order.\n       If they said what they want to buy, it IS an order — even if\n       unpaid, or missing a phone, address or date. Record the gaps\n       in `issues`; never drop an order for being incomplete.\n    6. Prefer over-reporting to missing one. The cost of losing an\n       order far exceeds the cost of one extra.\n    \"\"\"\n    chat_log     = dspy.InputField(desc=\"raw LINE chat log\")\n    current_date = dspy.InputField(desc=\"today, to resolve 'this Wednesday'\")\n    orders_json  = dspy.OutputField(desc=\"array of order objects\")"}, {"id": "recall", "stage": "Recall", "title": "Go back and look for what pass one missed", "path": "src/utils/dspy_modules/chat_log_parser.py", "say": "This is the stage I would defend hardest. It costs a second call on every import and usually returns an empty list — and that empty list is exactly what I am paying for.", "code": "class OrderRecallSignature(dspy.Signature):\n    \"\"\"Check whether any order was missed.\n\n    In practice a single extraction pass silently drops orders, and\n    different models drop different ones: some lose the second\n    recipient, some throw away a customer who said they would pay\n    later. A missing order is the hardest error to notice — a wrong\n    field is visible, a vanished order is not.\n    \"\"\"\n\ndef _recall_missing(self, chat_log, current_date, orders):\n    try:\n        result = self.recall(...)\n        candidates = self._extract_orders(result.missing_orders_json)\n    except Exception as error:\n        # A quality check must never take down the thing it checks:\n        # if recall fails, pass one's result still stands.\n        logger.warning(f'recall failed, keeping pass 1: {error}')\n        return []\n    seen = {self._identity(o) for o in orders}\n    return [c for c in candidates\n            if self._identity(c) not in seen and not self._is_empty(c)]"}, {"id": "json", "stage": "Robustness", "title": "Tolerate the prose the model writes around its JSON", "path": "src/utils/dspy_modules/chat_log_parser.py", "say": "This one crashed a real import while I was preparing this demo. The old fallback used a greedy bracket match, so one stray closing bracket in the model's trailing sentence swallowed everything and the whole batch failed. raw_decode takes the first complete JSON value and ignores the rest.", "code": "try:\n    parsed = json.loads(text)\nexcept json.JSONDecodeError:\n    # The model sometimes writes a sentence before or after the JSON.\n    # Start at the first [ or { and raw_decode the first complete value,\n    # ignoring whatever trails it.\n    #\n    # This used to be a greedy \\[.*\\] match, which grabbed everything\n    # between the first [ and the LAST ] anywhere in the output — one\n    # extra bracket in a trailing note and the entire batch failed.\n    starts = [i for i in (text.find('['), text.find('{')) if i >= 0]\n    if not starts:\n        raise ValueError(f'no order JSON in LLM output: {raw[:200]}')\n    parsed, _ = json.JSONDecoder().raw_decode(text[min(starts):])"}, {"id": "options", "stage": "Rules", "title": "Map to options that actually exist", "path": "src/utils/form_options.py", "say": "The model returns a spec and a count, never the option string itself. If it wrote the string it could invent an option the form does not offer, and the row would look perfectly fine while being unfillable. Note the missing comma on line 5 — that typo is in the real form, so it is copied exactly. Fixing it here would break the match.", "code": "GIFTBOX_OPTIONS: Dict[Tuple[str, int], str] = {\n    ('20A', 1): '20A one box $1,150',\n    ('20A', 2): '20A two boxes $2,170',        # tiered, not unit x qty\n    ('20A', 5): '20A five boxes $5,370 (two cartons)',\n    ('18A', 7): '18A seven boxes $6510 (two cartons)',  # form has no comma\n}\n\nif count > max_boxes:\n    problems.append(\n        f'{label} {count}{unit} exceeds the form maximum ({max_boxes})')\n    return None"}, {"id": "dedup", "stage": "Dedup", "title": "One normalized identity key per order", "path": "src/utils/form_sheet_client.py", "say": "0955-111-222 and 0955111222 are the same customer. Normalizing before comparing is the difference between a dedup check and a decoration.", "code": "def dedup_key(receiver_name, receiver_phone, shipping_date):\n    \"\"\"Identity key: strip phone separators and normalize the date, so\n    formatting differences do not cause a miss.\"\"\"\n    phone = ''.join(ch for ch in (receiver_phone or '') if ch.isdigit())\n    date = _normalize_date(shipping_date)\n    return f'{(receiver_name or \"\").strip()}|{phone}|{date}'\n\n@property\ndef status(self) -> str:\n    if self.duplicate:\n        return 'duplicate'\n    return 'review' if self.problems else 'ready'"}, {"id": "verify", "stage": "Write", "title": "Verify the columns before every write", "path": "src/utils/form_sheet_client.py", "say": "This is the failure mode that worried me most: nothing throws, nothing looks wrong, and phone numbers quietly start landing in the address column. One extra read per write buys a loud failure instead of a silent one.", "code": "def verify_columns(self) -> Dict[str, Any]:\n    \"\"\"Confirm the sheet's column order matches what the code expects.\n\n    Editing a Google Form question shifts the columns, and every write\n    after that lands in the wrong field — so verify before each write.\"\"\"\n    actual = ...  # read row 1, A1:L1\n    if actual == FORM_COLUMNS:\n        return {'ok': True, 'columns': actual}\n\n    for index, expected in enumerate(FORM_COLUMNS):\n        found = actual[index] if index < len(actual) else '<missing>'\n        if found != expected:\n            column = chr(ord('A') + index)\n            mismatches.append(\n                f'column {column}: expected {expected}, got {found}')"}, {"id": "tabs", "stage": "Split", "title": "Date tabs are a projection, not a copy", "path": "src/services/sheet_date_organizer.py", "say": "Because each tab is rebuilt from scratch, re-running is idempotent — and that same property forces the cleanup: if an order moves to another date, the tab it left behind is holding rows with no source, which is simply wrong data.", "code": "# Once an order's delivery date changes, the old date's tab is left\n# holding rows with no source. A date tab is a projection of the master\n# sheet — stale rows are simply wrong — so those get cleared too.\nstale = [name for name in existing\n         if is_date_sheet(name) and name not in groups]\n\n# RAW, not USER_ENTERED: these values already came out of the master\n# sheet as display strings. Letting Sheets re-interpret them turns the\n# phone number 0937... into a number and eats the leading zero.\nself.service.spreadsheets().values().update(\n    spreadsheetId=self.sheet_id,\n    range=f\"'{sheet_name}'!A1\",\n    valueInputOption='RAW',\n    body={'values': [header] + data_rows + (extra_rows or []),\n          'majorDimension': 'ROWS'})"}, {"id": "tracing", "stage": "Observe", "title": "One trace session per order", "path": "src/utils/langfuse_tracing.py", "say": "The session key is the dedup key, so when a customer amends an order and it is re-imported, the new run lands in the same session and one timeline holds the whole history. Tracing is optional: with no API keys it disables itself silently — observability must never be able to break the thing it observes.", "code": "# Only span CREATION may fail silently; anything raised after the yield\n# is the caller's business error and must propagate untouched.\n#\n# This used to wrap the whole with-block including the yield. A caller\n# exception was caught here and then yielded again — which a context\n# m function el(t, c, txt) { const e = document.createElement(t);

/* 電話與末五碼在畫面上可遮蔽；本 demo 的人名電話都是自編的，
   但 pipeline 真的跑過的資料仍照遮蔽處理，示範資料外洩的防線。 */
const PII = [/\b09\d{2}-?\d{3}-?\d{3}\b/g, /\b0\d{1,2}-?\d{6,8}\b/g];
function pii(text) {
  const span = el("span");
  let parts = [{ t: String(text ?? ""), p: false }];
  for (const re of PII) {
    const next = [];
    for (const seg of parts) {
      if (seg.p) { next.push(seg); continue; }
      let last = 0, m; re.lastIndex = 0;
      while ((m = re.exec(seg.t))) {
        if (m.index > last) next.push({ t: seg.t.slice(last, m.index), p: false });
        next.push({ t: m[0], p: true });
        last = m.index + m[0].length;
      }
      if (last < seg.t.length) next.push({ t: seg.t.slice(last), p: false });
    }
    parts = next;
  }
  for (const seg of parts) {
    if (seg.p) span.appendChild(el("span", "pii", seg.t));
    else span.appendChild(document.createTextNode(seg.t));
  }
  return span;
}

/* 極簡三色上色：先切出字串與註解，剩下的才上關鍵字，避免互相污染 */
function hlPy(src) {
  const KW = /\b(def|class|return|if|elif|else|for|while|try|except|finally|with|as|in|not|and|or|None|True|False|continue|break|import|from|lambda|raise|pass|yield)\b/g;
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let out = "", i = 0;
  const re = /("""[\s\S]*?"""|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|#[^\n]*)/g;
  let m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(i, m.index)).replace(KW, '<span class="tok-k">$1</span>');
    const cls = m[0][0] === "#" ? "tok-c"
      : m[0].startsWith('"""') ? "tok-c" : "tok-s";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    i = m.index + m[0].length;
  }
  out += esc(src.slice(i)).replace(KW, '<span class="tok-k">$1</span>');
  return out;
}

    const head = el("div", "chead");
    head.tabIndex = 0;
    head.appendChild(el("span", "cstage", sn.stage));
    head.appendChild(el("span", "ctitle", sn.title));
    head.appendChild(el("span", "caret",
      codeOpen.has(sn.id) ? "▲ collapse" : "▼ code"));
    const toggle = () => {
      codeOpen.has(sn.id) ? codeOpen.delete(sn.id) : codeOpen.add(sn.id);
      render();
    };
    head.onclick = toggle;
    head.onkeydown = e => { if (e.key === "Enter" || e.key === " ") {
      e.preventDefault(); toggle(); } };
    cc.appendChild(head);
    const body = el("div", "cbody");
    body.appendChild(el("div", "csay", "🗣 " + sn.say));
    body.appendChild(el("div", "cpath", sn.path));
    const pre = el("pre", "code");
    pre.innerHTML = hlPy(sn.code);
    body.appendChild(pre);
    cc.appendChild(body);
    card.appendChild(cc);
  });
  return card;
}

function pageOverview() {
  const s = el("section", "page");

  const intro = el("div", "card");
  intro.appendChild(el("h2", null, "In one sentence"));
  intro.appendChild(el("p", "lead",
    "An agent that reads a raw LINE group conversation, extracts every order " +
    "that was actually placed — across scattered messages, amendments and " +
    "small talk — validates each one against the shop's real product options, " +
    "and writes it to the Google Form response sheet, then splits that sheet " +
    "by delivery date and prints what has to be packed."));
  intro.appendChild(el("p", "small mut",
    "Built for a pear gift-box shop that was retyping LINE messages into a " +
    "spreadsheet by hand. Every stage below is running today except the four " +
    "marked with dashes."));
  s.appendChild(intro);

  const tiles = el("div", "tiles");
  for (const [v, l] of DATA.tiles) {
    const t = el("div", "tile");
    t.appendChild(el("div", "v", v));
    t.appendChild(el("div", "l", l));
    tiles.appendChild(t);
  }
  s.appendChild(tiles);

  const flowCard = el("div", "card");
  flowCard.appendChild(el("h2", null, "Pipeline"));
  flowCard.appendChild(buildFlow(null));
  const lg = el("div", "legend");
  const a = el("i"); a.appendChild(el("span", "lsw"));
  a.appendChild(document.createTextNode("built and running"));
  const b = el("i"); b.appendChild(el("span", "lsw d"));
  b.appendChild(document.createTextNode("not wired up yet"));
  lg.appendChild(a); lg.appendChild(b);
  flowCard.appendChild(lg);
  flowCard.appendChild(el("p", "small mut",
    "Two things carry most of the design: a second LLM pass whose only job " +
    "is to find orders the first pass silently dropped, and a human gate — " +
    "nothing reaches the spreadsheet without someone selecting it."));
  s.appendChild(flowCard);

  s.appendChild(buildCodeSection());

  const nw = el("div", "card");
  nw.appendChild(el("h2", null, "Not wired up yet"));
  nw.appendChild(el("p", "small mut",
    "Listed rather than hidden. Being asked about these and having an answer " +
    "beats being caught claiming they work."));
  const tb = el("table", "t");
  const hr = el("tr");
  ["Track", "State today", "What's left"].forEach(h =>
    hr.appendChild(el("th", null, h)));
  tb.appendChild(hr);
  DATA.notwired.forEach(n => {
    const tr = el("tr");
    tr.appendChild(el("td", null, n.name));
    tr.appendChild(el("td", "mut", n.state));
    tr.appendChild(el("td", "mut", n.left));
    tb.appendChild(tr);
  });
  nw.appendChild(tb);
  s.appendChild(nw);
  return s;
}

/* ── Replay Theater ── */
const th = { c: 0, step: 0 };

const STAGE_LABEL = {
  sanitize: "Sanitize", extract: "Extract · pass 1", recall: "Recall · pass 2",
  address: "Address", option: "Option map", row: "Build row", dedup: "Dedup key",
};
const STAGE_NODE = {
  sanitize: "sanitize", extract: "extract", recall: "recall",
  address: "rules", option: "rules", row: "rules", dedup: "dedup",
};

function narration(ev) {
  switch (ev.stage) {
    case "sanitize":
      return ev.removed
        ? ev.removed + " emoji / zero-width characters removed before the " +
          "model sees anything. Fewer tokens, and nothing for it to copy " +
          "into a name or an address."
        : "No emoji in this conversation, so the text passes through " +
          "unchanged — the stage still runs, it just has nothing to do.";
    case "extract":
      return "One LLM call over the whole conversation. It has to merge " +
        "details scattered across messages, apply later amendments over " +
        "earlier ones, and ignore anyone who was only asking.";
    case "recall":
      return ev.out.trim() === "[]"
        ? "The second pass re-read the same log against what pass one found " +
          "and confirmed nothing was missed. Empty is the good outcome — " +
          "and it still has to be paid for, because a silent drop is the " +
          "one error nobody catches downstream."
        : "The second pass found an order the first pass dropped. It gets " +
          "tagged as recovered, so the reviewer knows which row the first " +
          "pass was not confident about.";
    case "address":
      return ev.changed
        ? "Address normalized by the rule base — note 台 → 臺, the official " +
          "character. Rules, not the model: this is a lookup problem, and a " +
          "lookup cannot hallucinate a district that does not exist."
        : "Address already in standard form; the normalizer left it alone.";
    case "option":
      return ev.out === "(no match)"
        ? "Nothing ordered in this category, so there is nothing to map."
        : "The model only ever returned a spec and a count. The exact " +
          "dropdown string comes from a lookup table — if the model wrote " +
          "it, it could invent an option the form does not offer.";
    case "row":
      return "Twelve columns, in the sheet's exact order. Status is " +
        (ev.status === "ready"
          ? "ready — complete, so it can be written."
          : "review — " + T(ev, "problems").join(" / ") +
            ". It will not be written unless a human opts in.");
    case "dedup":
      return "Identity key for this order. Phone separators stripped and the " +
        "date normalized first, so the same order typed twice with different " +
        "punctuation still collides. The same key is the Langfuse session id.";
    default: return "";
  }
}

function pageTheater() {
  const s = el("section", "page");

  const pick = el("div", "card");
  pick.appendChild(el("h2", null, "Replay Theater — a real run, step by step"));
  const sel = el("div", "controls");
  DATA.cases.forEach((c, i) => {
    const b = el("button", i === th.c ? "primary" : null,
      c.title + " (" + c.events.length + " steps)");
    b.onclick = () => { th.c = i; th.step = 0; render(); };
    sel.appendChild(b);
  });
  pick.appendChild(sel);
  pick.appendChild(el("p", "small mut",
    "Every value below is what the pipeline actually produced on " +
    DATA.built_at + " with " + DATA.model + " — captured by wrapping the " +
    "real methods, not re-implemented. The conversations are written for " +
    "this demo; no customer data is shown. Values are shown translated — " +
    "tick “Show 中文 original” in the header for exactly what the " +
    "pipeline produced. Navigate with ◀ ▶ or arrow keys."));
  s.appendChild(pick);

  const c = DATA.cases[th.c];
  const cur = Math.min(th.step, c.events.length - 1);
  const ev = c.events[cur];

  const logCard = el("div", "card");
  logCard.appendChild(el("h3", null, "Input conversation"));
  logCard.appendChild(el("p", "small mut", c.note));
  const lg = el("div", "rowout");
  lg.appendChild(pii(T(c, "raw_log").trim()));
  logCard.appendChild(lg);
  s.appendChild(logCard);

  const flowCard = el("div", "card");
  flowCard.appendChild(el("h3", null, "Where we are"));
  flowCard.appendChild(buildFlow(STAGE_NODE[ev.stage]));
  const dots = el("div", "dots");
  c.events.forEach((x, i) => {
    const d = el("div", "dot" + (i === cur ? " on" : i < cur ? " done" : ""),
      String(i + 1));
    d.title = STAGE_LABEL[x.stage] || x.stage;
    d.onclick = () => { th.step = i; render(); };
    dots.appendChild(d);
  });
  flowCard.appendChild(dots);
  const ctr = el("div", "controls");
  const prev = el("button", null, "◀ Prev");
  prev.disabled = cur === 0;
  prev.onclick = () => { th.step = cur - 1; render(); };
  const next = el("button", "primary", "Next ▶");
  next.disabled = cur === c.events.length - 1;
  next.onclick = () => { th.step = cur + 1; render(); };
  ctr.appendChild(prev); ctr.appendChild(next);
  ctr.appendChild(el("span", "small mut",
    "  step " + (cur + 1) + " / " + c.events.length));
  flowCard.appendChild(ctr);
  s.appendChild(flowCard);

  const det = el("div", "card");
  const h = el("h2");
  h.appendChild(document.createTextNode(STAGE_LABEL[ev.stage] || ev.stage));
  if (ev.status) { h.appendChild(document.createTextNode(" ")); h.appendChild(badge(ev.status)); }
  det.appendChild(h);

  if (ev.stage === "row") {
    det.appendChild(ioRow("IN", T(ev, "inp"), true));
    const grid = el("table", "t");
    const hr2 = el("tr");
    ["#", "Column", "Value"].forEach(x => hr2.appendChild(el("th", null, x)));
    grid.appendChild(hr2);
    DATA.columns.forEach((col, i) => {
      const tr = el("tr");
      tr.appendChild(el("td", "mut", String.fromCharCode(65 + i)));
      tr.appendChild(el("td", null, col));
      const td = el("td", "io-mono");
      td.appendChild(pii(T(ev, "out")[i] || "—"));
      tr.appendChild(td);
      grid.appendChild(tr);
    });
    det.appendChild(grid);
  } else {
    det.appendChild(ioRow("IN", T(ev, "inp"),
      ["extract", "recall", "dedup", "option"].includes(ev.stage)));
    det.appendChild(ioRow("OUT", T(ev, "out"), true));
  }
  det.appendChild(el("div", "narr", narration(ev)));
  s.appendChild(det);

  if (cur === c.events.length - 1) {
    const done = el("div", "card");
    done.appendChild(el("h3", null,
      "Result — " + c.orders.length + " order" +
      (c.orders.length === 1 ? "" : "s") + " extracted"));
    const tb = el("table", "t");
    const hr3 = el("tr");
    ["Recipient", "Item", "Ship date", "Status"].forEach(x =>
      hr3.appendChild(el("th", null, x)));
    tb.appendChild(hr3);
    c.orders.forEach(o => {
      const tr = el("tr");
      const od = showZh ? o.order : (o.order_en || o.order);
      const td0 = el("td"); td0.appendChild(pii(od.receiver_name));
      tr.appendChild(td0);
      tr.appendChild(el("td", null, od.giftbox || od.family || "—"));
      tr.appendChild(el("td", null, od.shipping_date || "—"));
      const td3 = el("td"); td3.appendChild(badge(o.status));
      tr.appendChild(td3);
      tb.appendChild(tr);
    });
    done.appendChild(tb);
    s.appendChild(done);
  }

  const sum = el("div", "card");
  sum.appendChild(el("h3", null, "Packing summary across both runs"));
  sum.appendChild(el("p", "small mut",
    "What organize_by_date.py appends under each delivery-date tab. " +
    "\"N addresses\" counts order rows, not distinct addresses — one row is " +
    "one shipment, so two orders to the same address still need two parcels."));
  const out = el("div", "rowout");
  const totals = showZh ? DATA.summary.totals : DATA.summary.totals_en;
  out.textContent = DATA.summary.lines.map(l => T(l, "text")).join("\n") +
    "\n── " + DATA.summary.order_count + " orders / " +
    Object.entries(totals).map(([u, n]) => n + " " + u).join(" / ");
  sum.appendChild(out);
  s.appendChild(sum);

  return s;
}

/* ── shell ── */
function render() {
  showZh = document.getElementById("zh").checked;
  const nav = document.getElementById("nav");
  nav.textContent = "";
  PAGES.forEach((p, i) => {
    const b = el("button", i === page ? "on" : null, p);
    b.onclick = () => { page = i; render(); };
    nav.appendChild(b);
  });
  const main = document.getElementById("main");
  main.textContent = "";
  const s = page === 0 ? pageOverview() : pageTheater();
  s.classList.add("on");
  main.appendChild(s);
  document.body.classList.toggle("masked",
    document.getElementById("mask").checked);
}

document.getElementById("mask").onchange = render;
document.getElementById("zh").onchange = render;
document.addEventListener("keydown", e => {
  if (page !== 1) return;
  const n = DATA.cases[th.c].events.length;
  if (e.key === "ArrowRight") { th.step = Math.min(th.step + 1, n - 1); render(); }
  if (e.key === "ArrowLeft") { th.step = Math.max(th.step - 1, 0); render(); }
});
render();
</script>
